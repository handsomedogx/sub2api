name: Dog container image

on:
  push:
    tags:
      - 'dog-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dog-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'handsomedogx/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected source
        uses: actions/checkout@v6

      - name: Prepare image identity
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dog"
          version="$(tr -d '\r\n' < backend/cmd/server/VERSION)-dog"
          {
            echo "name=$image"
            echo "version=$version"
            echo 'tags<<TAGS'
            echo "$image:sha-${GITHUB_SHA:0:12}"
            if [[ "$GITHUB_REF" == refs/tags/dog-* ]]; then
              echo "$image:$GITHUB_REF_NAME"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Linux amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            NODE_OPTIONS=--max-old-space-size=4096
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=dog-image-amd64
          cache-to: type=gha,mode=max,scope=dog-image-amd64

      - name: Check built binary
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker run --rm "$IMAGE_NAME:sha-${GITHUB_SHA:0:12}" -version

      - name: Export portable image archive
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        working-directory: ${{ runner.temp }}
        run: |
          docker image save "$IMAGE_NAME:sha-${GITHUB_SHA:0:12}" -o sub2api-dog.tar
          sha256sum sub2api-dog.tar > sub2api-dog.tar.sha256

      - name: Upload portable image archive
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-dog-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sub2api-dog.tar
            ${{ runner.temp }}/sub2api-dog.tar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned images
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then docker push "$tag"; fi
          done <<< "$IMAGE_TAGS"
          image_ref="$(docker image inspect "$IMAGE_NAME:sha-${GITHUB_SHA:0:12}" --format '{{index .RepoDigests 0}}')"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Record deployable image
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo '## Built image'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo "$IMAGE_REF"
            echo '```'
            echo 'Deploy the digest or a selected version tag. This workflow does not change a running server.'
          } >> "$GITHUB_STEP_SUMMARY"
